name: Windows

on:
  push:
    paths:
      - "windows/**"
      - "Resources/GaoCiYuanIcon.png"
      - "Resources/ProviderIcons/**"
      - "Resources/PanelIcons/claude-native-white-flower.png"
      - "Resources/Translations.tsv"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - "Resources/GaoCiYuanIcon.png"
      - "Resources/ProviderIcons/**"
      - "Resources/PanelIcons/claude-native-white-flower.png"
      - "Resources/Translations.tsv"
      - ".github/workflows/windows.yml"

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install build dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          $directory = Join-Path $env:RUNNER_TEMP 'gaociyuan-inno'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $installer
          $sig = Get-AuthenticodeSignature -LiteralPath $installer
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch '(^|, )CN=Pyrsys B\.V\.(,|$)') {
            throw 'Inno Setup did not have the expected signature.'
          }
          $proc = Start-Process -FilePath $installer -WindowStyle Hidden -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', '/CURRENTUSER', '/PORTABLE=1', ('/DIR="{0}"' -f $directory))
          if ($proc.ExitCode -ne 0) { throw "Inno Setup installation failed ($($proc.ExitCode))." }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "GAOCIYUAN_ISCC=$(Join-Path $directory 'ISCC.exe')"
      - name: Test and build the x64 installer
        run: ./build.ps1 -Iscc $env:GAOCIYUAN_ISCC
      - name: Smoke-test installation and legacy data migration
        run: ./smoke-installed.ps1 -HeadlessServerOnly -Verbose
      - uses: actions/upload-artifact@v4
        with:
          name: GaoCiYuan-Windows-4.15-build3-x64
          if-no-files-found: error
          path: |
            windows/dist/GaoCiYuan-Windows-4.15-build3-x64-Setup.exe
            windows/dist/GaoCiYuan-Windows-4.15-build3-x64-Setup.exe.sha256
