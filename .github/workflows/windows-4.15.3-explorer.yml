name: Exact Windows 4.15+3 Explorer verification

on:
  push:
    branches: [verify/windows-4.15-build3-explorer]

permissions:
  actions: read
  contents: read

jobs:
  exact-package:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46114353999
          name: GaoCiYuan-Windows-4.15-build3-x64
          path: windows/build/exact-4.15.3
      - name: Inspect the exact installer, packaged GUI and isolated Explorer
        run: ../.github/Run-ExactExplorerProbe.ps1
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: GaoCiYuan-4.15.3-Explorer-evidence
          path: windows/build/explorer-evidence
          if-no-files-found: warn
