name: macOS fixes validation
on:
  push:
    branches: ['codex/macos-fixes-20261128-05da204017-full-regression']
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and run isolated checks
        shell: bash
        run: |
          set -euo pipefail
          git show -s --format='Production source %H' HEAD^
          uname -m
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer xcodebuild -version
          bash scripts/verify_macos.sh
