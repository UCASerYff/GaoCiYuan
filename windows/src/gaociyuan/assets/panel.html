<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="gao-token" content="{{TOKEN}}">
  <title>搞词元 · 悬浮窗</title>
  <link rel="stylesheet" href="/panel.css">
  <script src="/panel.js" defer></script>
</head>
<body>
  <div id="shell" data-dock="right">
    <aside id="rail" aria-label="Agent 额度">
      <button id="grip" type="button" aria-label="拖动悬浮窗" title="拖动悬浮窗"><span></span></button>
      <div id="rings"></div>
      <button id="overflow" type="button" hidden></button>
    </aside>
    <section id="detail" hidden></section>
    <div id="menu" hidden>
      <button type="button" data-action="open">打开搞词元</button>
      <button type="button" data-action="columns">切换单列 / 双列</button>
      <button type="button" data-action="settings">设置</button>
      <button type="button" data-action="hide">隐藏悬浮窗</button>
    </div>
  </div>
</body>
</html>
