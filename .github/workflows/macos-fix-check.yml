name: macOS fixes validation
on:
  push:
    branches: ['codex/macos-fixes-20261128-f3edb6ce06-agasync']
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and run isolated checks
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_macos.sh
